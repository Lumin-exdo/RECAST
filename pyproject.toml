[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "recast-mem"
version = "0.1.0"
description = "RECAST: Retroactive Evidence-based Conflict-Aware State Tracking — schema-free memory system for LLM agents with automatic staleness detection"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "sentence-transformers>=2.0",
    "numpy",
    "python-dotenv",
]

[project.scripts]
recast-run = "RECAST.run_new_mem:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["RECAST*"]
