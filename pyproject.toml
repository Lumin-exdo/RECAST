[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "amber-mem"
version = "0.1.0"
description = "AMBER: Abductive Memory with Belief Evolution and Reasoning — schema-free memory system for LLM agents with automatic staleness detection"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "sentence-transformers>=2.0",
    "numpy",
    "python-dotenv",
]

[project.scripts]
amber-run = "AMBER.run_new_mem:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["AMBER*"]
